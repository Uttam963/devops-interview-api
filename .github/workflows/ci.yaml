name: Application CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            --pull \
            --no-cache \
            --tag devops-interview-api:${{ github.sha }} \
            .

      - name: Verify runtime and dependency
        run: |
          docker run --rm \
            devops-interview-api:${{ github.sha }} \
            python -c "import msgpack; print('msgpack:', msgpack.__version__)"

          docker run --rm \
            devops-interview-api:${{ github.sha }} \
            python -c "from app import app; print('Application import successful')"

      - name: Export container filesystem
        shell: bash
        run: |
          mkdir -p container-rootfs
          container_id=$(docker create \
            devops-interview-api:${{ github.sha }})
          docker export "$container_id" |
            tar -x -C container-rootfs
          docker rm "$container_id"

      - name: Scan container filesystem with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: rootfs
          scan-ref: container-rootfs
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"