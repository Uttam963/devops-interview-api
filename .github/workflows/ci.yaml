name: Application CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: uttam963/devops-interview-api

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build \
            --pull \
            --no-cache \
            --tag devops-interview-api:${{ github.sha }} \
            .

      - name: Verify runtime and dependency
        run: |
          docker run --rm \
            devops-interview-api:${{ github.sha }} \
            python -c "import msgpack; print('msgpack:', msgpack.__version__)"

          docker run --rm \
            devops-interview-api:${{ github.sha }} \
            python -c "from app import app; print('Application import successful')"

      - name: Export container filesystem
        shell: bash
        run: |
          mkdir -p container-rootfs
          container_id=$(docker create \
            devops-interview-api:${{ github.sha }})
          docker export "$container_id" |
            tar -x -C container-rootfs
          docker rm "$container_id"

      - name: Scan container filesystem with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: rootfs
          scan-ref: container-rootfs
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag container image
        if: github.event_name == 'push'
        run: |
          docker tag \
            devops-interview-api:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker tag \
            devops-interview-api:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push container image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  update-gitops:
    name: Update GitOps image tag
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Uttam963/devops-interview-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update development image tag
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E \
            "s|^([[:space:]]*tag:).*|\1 \"${IMAGE_TAG}\"|" \
            charts/devops-api/values-dev.yaml

          grep -A 3 "^image:" \
            charts/devops-api/values-dev.yaml

      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if git diff --quiet; then
            echo "GitOps repository already uses ${IMAGE_TAG}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/devops-api/values-dev.yaml
          git commit -m "Deploy devops API image ${IMAGE_TAG}"
          git push origin main